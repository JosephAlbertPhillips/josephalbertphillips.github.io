project:
  type: website
  output-dir: docs
  pre-render:  # This can be deleted if you are using the manually curated list of publications in publications.qmd
    - python xlsx_to_yml.py  # Automatically generate publications.yml from publications.xlsx
    
# Meta
description-meta: "Quarto Academic Website adapted by Joseph Phillips"
author-meta: "Joseph Phillips"

website:
  title: "Joseph Phillips"
  image: "https://quarto.org/quarto.png"
  description: "Quarto Academic Website adapted by Joseph Phillips"
 
  navbar:
    background: light  # You can change the background color here

    left:   # You can comment out all navigation items here if you just like to keep the index page only
      - text: Research
        menu:
          - text: Publications Listing  # Automatically generated from publications.xlsx
            href: pub-listing.qmd        
          - text: Selected Papers
            href: posts.qmd#category=paper
          - text: Grants
            href: projects.qmd                                       
      - text: Teaching # Comment the Teaching part out to remove the Teaching page
        href: teaching.qmd
      - text: Blog
        href: posts.qmd#category=blog      
      - text: Presentations
        href: posts.qmd#category=presentation                   
#      - text: Group   # Comment the Group part out to remove the Group page
#        href: people.qmd

    right: 
      - text: CV
        href: files/nsf-biosketch.pdf
#      - icon: rss
#        href: posts.xml
#        target: _blank
  
  page-navigation: true
  
  page-footer: 
    center: "Build on [Quarto Academic Website Template](https://github.com/drganghe/quarto-academic-website-template) adapted by [Joseph Phillips](https://github.com/JosephAlbertPhillips)"
  
  search:
    location: navbar
    type: textbox
  
  reader-mode: true

  draft-mode: unlinked
  
  repo-url: https://github.com/drganghe/quarto-academic-website-template
#  repo-actions: [edit, issue, source]
  
  open-graph: true
  
  twitter-card: true 
#  card-style: summary      
  
  site-url: "https://drganghe.github.io/quarto-academic-website-template"
  
  google-analytics:
    tracking-id: ""  # Please delete or replace with your own tracking ID
    anonymize-ip: true 

bibliography: references.bib  # Add references.bib to the root folder to enable the bibliography function

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/drganghe\.github\.io\/custom'
    include-in-header: "files/includes/_academic.qmd"

